<!DOCTYPE html>
<html>
<head>
<title>ZLAB // LAB 01</title>
<style>
body{background:#000;color:#fff;font-family:monospace;display:flex;justify-content:center;align-items:center;height:100vh;margin:0}
.box{border:2px solid red;padding:30px;box-shadow:0 0 25px red;text-align:center;width:350px;background:#000}
input{background:#111;border:1px solid #555;color:#fff;padding:12px;margin-top:15px;width:90%;outline:none}
input.error{border:2px solid #d93025;background:#000}
#errorMsg{display:none;color:#d93025;font-size:13px;text-align:left;margin:8px 0 0 10px;font-family:Arial}
#errorMsg span{background:#d93025;color:white;border-radius:50%;width:18px;height:18px;display:inline-flex;justify-content:center;align-items:center;margin-right:6px;font-weight:bold}
.show{display:flex;align-items:center;gap:8px;margin:12px 0 0 10px;font-family:Arial;font-size:14px;color:#ccc;cursor:pointer}
button{background:red;color:black;padding:11px 22px;border:none;font-weight:bold;cursor:pointer;margin-top:18px;width:95%}
#success{margin-top:15px;color:#0f0;display:none}
</style>
</head>
<body>
<div class="box">
<h1 style="color:red">ZLAB - LAB 01</h1>
<p>ENTER AGENT CODE</p>
<input type="text" id="u" placeholder="Username">
<input type="password" id="p" placeholder="Enter your password" oninput="clearError()">
<div id="errorMsg"><span>!</span> Wrong password. Try again or click "Forgot password?" for more options.</div>
<label class="show"><input type="checkbox" onclick="toggle()" style="width:auto;margin:0"> Show password</label>
<br>
<button onclick="go()">ACCESS</button>
<div id="success"></div>
</div>
<script>
function clearError(){
 document.getElementById('p').classList.remove('error');
 document.getElementById('errorMsg').style.display='none';
}
function toggle(){
 var x=document.getElementById('p');
 x.type = x.type=="password"?"text":"password";
}
function go(){
 var u=document.getElementById('u').value;
 var p=document.getElementById('p').value;
 var input=document.getElementById('p');
 var err=document.getElementById('errorMsg');
 var suc=document.getElementById('success');

 if(u=="zlab" && p=="agent01"){
  input.classList.remove('error');
  err.style.display='none';
  suc.style.display='block';
  suc.style.color='#0f0';
  suc.innerHTML='>> ACCESS GRANTED';
 } else {
  input.classList.add('error');
  err.style.display='block';
  suc.style.display='none';
 }
}
</script>
</body>
</html>
